<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronunciation Sheet</title>
<style>
:root{--bg:#0c0c0e;--panel:#16161a;--panel2:#1d1d22;--line:#2b2b31;--text:#ececef;--mute:#8b8b95;--acc:#f2c230;--ok:#4cc38a;--warn:#e8a33d;--bad:#e5534b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 120px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px}
.logo i{width:30px;height:30px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;color:var(--acc);font-style:normal;font-size:15px}
h1{font-size:22px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.info{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.info .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}
input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--acc)}
select{color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:18px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);color:var(--mute);border:0;padding:8px 14px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:#111;font-weight:600}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:0 8px}
td{padding:0 4px;vertical-align:middle}
td.n{width:30px;color:var(--mute);text-align:center}
td.x{width:44px}
.xb{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--bad);font-size:16px;cursor:pointer}
.xb:hover{border-color:var(--bad)}
tr.rm .xb{color:var(--ok)}
tr.rm input,tr.rm .tr{opacity:.35;text-decoration:line-through}
tr.rm select{opacity:.35}
.tr{min-height:38px;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.ipa{font-family:"Segoe UI","Noto Sans","DejaVu Sans",sans-serif;font-size:16px}
.simple{color:var(--acc);font-weight:600;letter-spacing:.3px}
.hint{color:var(--mute);font-size:13px}
.add{display:block;margin:6px auto 0;width:44px;height:44px;border-radius:50%;font-size:24px;line-height:1;background:var(--panel2);color:var(--acc);border:1px solid var(--line);cursor:pointer}
.add:hover{border-color:var(--acc)}
.sum{position:fixed;left:0;right:0;bottom:0;background:#101013ee;border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:12px 16px}
.sum div{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cnt{font-size:15px;color:var(--mute)}.cnt b{color:var(--text);font-size:22px}
.grade{font-weight:700;font-size:18px;padding:6px 16px;border-radius:999px;border:1px solid currentColor}
.g-ex{color:var(--ok)}.g-vg{color:#7cc4ff}.g-g{color:var(--warn)}.g-r{color:var(--bad)}.g-n{color:var(--mute)}
.pr{display:none}
@media(max-width:640px){.info,.two{grid-template-columns:1fr}}
@media print{
 body{background:#fff;color:#000}
 .wrap{padding:0}.card{background:#fff;border-color:#999}
 input,select{background:#fff;color:#000;border-color:#999;appearance:none}
 .bar,.add,.sum,.xb,td.x,th.x,tr.rm{display:none!important}
 .simple{color:#000}.pr{display:block;margin-top:14px;font-size:18px;font-weight:700}
 .logo i{color:#000;border-color:#000}
}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <h1>Pronunciation</h1>
  <div class="logo"><i>◐</i>planetenglish</div>
 </header>

 <div class="card">
  <div class="info">
   <div><label>Student</label><input id="student"></div>
   <div><label>Date</label><input type="date" id="date"></div>
   <div class="full two"><div><label>Book</label><input id="book"></div><div><label>Lessons</label><input id="lessons"></div></div>
  </div>
 </div>

 <div class="bar">
  <div class="seg" id="mode">
   <button data-m="both" class="on">IPA + Simple</button><button data-m="ipa">IPA</button><button data-m="simple">Simple</button>
  </div>
  <button class="btn pri" onclick="window.print()">Download PDF</button>
 </div>

 <table>
  <thead><tr><th></th><th style="width:30%">Word</th><th style="width:22%">Category</th><th>Transcription</th><th class="x"></th></tr></thead>
  <tbody id="rows"></tbody>
 </table>
 <button class="add" id="add" title="Add word">+</button>
 <div class="pr" id="pr"></div>
</div>

<div class="sum"><div>
 <span class="cnt">Words to work on: <b id="count">0</b> <span class="hint">(removed words don't count)</span></span>
 <span class="grade g-n" id="grade">—</span>
</div></div>

<script>
const CATS=["Stress","Intonation","Intelligibility","Rhythm","Pronunciation"];
const rows=[];let mode="both";
const $=id=>document.getElementById(id);
$("date").valueAsDate=new Date();

const MAP=[['tʃ','ch'],['dʒ','j'],['aɪ','eye'],['aʊ','ow'],['ɔɪ','oy'],['eɪ','ay'],['oʊ','oh'],['əʊ','oh'],['ɑː','ah'],['ɔː','aw'],['iː','ee'],['uː','oo'],['ɜː','er'],['ɪə','eer'],['ɛə','air'],['ʃ','sh'],['ʒ','zh'],['θ','th'],['ð','th'],['ŋ','ng'],['j','y'],['æ','a'],['ɛ','eh'],['e','eh'],['ɪ','ih'],['i','ee'],['ʊ','u'],['u','oo'],['ʌ','uh'],['ə','uh'],['ɚ','er'],['ɝ','er'],['ɑ','ah'],['ɔ','aw'],['ɒ','ah'],['ɡ','g'],['ɹ','r'],['ɾ','t'],['ː',''],['ʔ',''],['ʰ',''],['ˈ','|S'],['ˌ','|'],['.','|'],['·','|']];
function simplify(ipa){
 const s=ipa.replace(/[\/\[\]()]/g,"");let out="";
 for(let i=0;i<s.length;){
  const m=MAP.find(([k])=>s.startsWith(k,i));
  if(m){out+=m[1];i+=m[0].length}else{out+=s[i];i++}
 }
 return out.split("|").filter(Boolean).map(p=>p[0]==="S"?p.slice(1).toUpperCase():p).join("-");
}

async function lookup(w){
 const r=await fetch("https://api.dictionaryapi.dev/v2/entries/en/"+encodeURIComponent(w));
 if(!r.ok)throw 0;
 const d=await r.json();
 const all=d.flatMap(e=>(e.phonetics||[]).concat(e.phonetic?[{text:e.phonetic}]:[])).filter(p=>p.text);
 const us=all.find(p=>/-us\b|-us\./.test(p.audio||""))||all[0];
 if(!us)throw 0;
 return us.text.replace(/^\/|\/$/g,"");
}

function renderTrans(r){
 const c=r.tr;c.innerHTML="";
 if(r.state==="load"){c.innerHTML='<span class="hint">Looking up…</span>';return}
 if(r.state==="none"){c.innerHTML='<span class="hint">Not found — check the spelling</span>';return}
 if(!r.ipa)return;
 if(mode!=="simple"){const a=document.createElement("span");a.className="ipa";a.textContent="/"+r.ipa+"/";c.appendChild(a)}
 if(mode!=="ipa"){const b=document.createElement("span");b.className="simple";b.textContent=simplify(r.ipa);c.appendChild(b)}
}

function addRow(){
 const r={word:"",state:"",ipa:"",removed:false,last:""};
 const tr=document.createElement("tr");
 const n=document.createElement("td");n.className="n";
 const w=document.createElement("td"),inp=document.createElement("input");inp.placeholder="Word";inp.autocapitalize="off";w.appendChild(inp);
 const c=document.createElement("td"),sel=document.createElement("select");
 sel.innerHTML='<option value="">Category…</option>'+CATS.map(x=>`<option>${x}</option>`).join("");c.appendChild(sel);
 const t=document.createElement("td"),box=document.createElement("div");box.className="tr";t.appendChild(box);
 const x=document.createElement("td");x.className="x";
 const xb=document.createElement("button");xb.className="xb";xb.textContent="✕";xb.title="Student knows this word";x.appendChild(xb);
 tr.append(n,w,c,t,x);
 Object.assign(r,{el:tr,tr:box,inp,sel,n});
 const go=async()=>{
  const v=inp.value.trim().toLowerCase();
  if(v===r.last)return;r.last=v;r.word=v;r.ipa="";r.state="";
  if(!v){renderTrans(r);update();return}
  r.state="load";renderTrans(r);update();
  try{r.ipa=await lookup(v);r.state="ok"}catch(e){r.state="none"}
  if(r.last===v){renderTrans(r);update()}
 };
 inp.addEventListener("blur",go);
 inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go();const i=rows.indexOf(r);if(i===rows.length-1)addRow();rows[i+1]&&rows[i+1].inp.focus()}});
 sel.addEventListener("change",update);
 xb.onclick=()=>{r.removed=!r.removed;tr.classList.toggle("rm",r.removed);xb.textContent=r.removed?"↺":"✕";xb.title=r.removed?"Undo":"Student knows this word";update()};
 rows.push(r);$("rows").appendChild(tr);number();return r;
}
function number(){rows.forEach((r,i)=>r.n.textContent=i+1)}

function update(){
 const k=rows.filter(r=>r.word&&!r.removed).length;
 $("count").textContent=k;
 let g,cl;
 if(!k&&!rows.some(r=>r.word)){g="—";cl="g-n"}
 else if(k<=5){g="Excellent";cl="g-ex"}
 else if(k<=10){g="Very Good";cl="g-vg"}
 else if(k<=15){g="Good";cl="g-g"}
 else{g="Repeat";cl="g-r"}
 $("grade").textContent=g;$("grade").className="grade "+cl;
 $("pr").textContent="Words: "+k+" — "+g;
}

$("add").onclick=()=>addRow().inp.focus();
$("mode").onclick=e=>{
 const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;
 [...$("mode").children].forEach(x=>x.classList.toggle("on",x===b));
 rows.forEach(renderTrans);
};
for(let i=0;i<10;i++)addRow();
update();
</script>
</body>
</html>
