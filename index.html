<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Lookup</title>
<style>

:root{--bg:#0c0c0e;--panel:#16161a;--panel2:#1d1d22;--line:#2b2b31;--text:#ececef;--mute:#8b8b95;--acc:#f2c230;--ok:#4cc38a;--warn:#e8a33d;--bad:#e5534b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 120px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px}
.logo i{width:30px;height:30px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;color:var(--acc);font-style:normal;font-size:15px}
h1{font-size:22px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.info{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.info .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px}
input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:inherit;outline:none}
input:focus,select:focus{border-color:var(--acc)}
select{color-scheme:dark}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:18px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);color:var(--mute);border:0;padding:8px 14px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:#111;font-weight:600}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}

.hint{color:var(--mute);font-size:13px}
.sb{display:flex;gap:8px;margin:6px 0 14px}.sb input{font-size:17px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:5px 13px;cursor:pointer;font:inherit}
.chip:hover{border-color:var(--acc)}
h2.w{font-size:30px;margin:0 0 2px}.wes{color:var(--acc);font-size:17px;margin-bottom:12px}
.pl{display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.ipa{font-family:"Segoe UI","Noto Sans","DejaVu Sans",sans-serif;font-size:22px}.simple{color:var(--acc);font-weight:700;font-size:20px;letter-spacing:.4px}
.lab{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.m{padding:10px 0;border-top:1px solid var(--line)}.pos{color:var(--acc);font-style:italic;margin-right:6px}
.lnk{background:none;border:0;color:var(--acc);cursor:pointer;padding:0;font:inherit;font-size:13px;margin-top:4px}.ex{color:var(--mute);font-style:italic;margin-top:4px}.es2{color:var(--acc);margin-top:2px}.exs{margin-top:8px}
.esw{color:var(--text);font-size:17px;font-weight:600;margin-top:2px}.note{color:var(--mute);font-size:12px;margin-top:18px}
@media(max-width:640px){.info{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header><h1>Word Lookup</h1><div class="logo"><i>◐</i>planetenglish</div></header>
<div class="sb"><input id="q" placeholder="Type an English word or phrasal verb…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn pri" id="go">Search</button></div>
<div class="chips" id="recent"></div>
<div class="card" id="out"><span class="hint">Type a word to see how it is pronounced, what it means, and its Spanish translation.</span></div>
<p class="note">Meanings and Spanish translations come from Wiktionary; example sentences from Wiktionary (a community project).</p>
</div>
<script>
const $=id=>document.getElementById(id);
const MAP=[['tʃ','ch'],['dʒ','j'],['aɪ','eye'],['aʊ','ow'],['ɔɪ','oy'],['eɪ','ay'],['oʊ','oh'],['əʊ','oh'],['ɑː','ah'],['ɔː','aw'],['iː','ee'],['uː','oo'],['ɜː','er'],['ɪə','eer'],['ɛə','air'],['ʃ','sh'],['ʒ','zh'],['θ','th'],['ð','th'],['ŋ','ng'],['j','y'],['æ','a'],['ɛ','eh'],['e','eh'],['ɪ','ih'],['i','ee'],['ʊ','u'],['u','oo'],['ʌ','uh'],['ə','uh'],['ɚ','er'],['ɝ','er'],['ɑ','ah'],['ɔ','aw'],['ɒ','ah'],['ɡ','g'],['ɹ','r'],['ɾ','t'],['ː',''],['ʔ',''],['ʰ',''],['ˈ','|S'],['ˌ','|'],['.','|'],['·','|']];
function simplify(ipa){
 const s=ipa.replace(/[\/\[\]()]/g,"");let out="";
 for(let i=0;i<s.length;){
  const m=MAP.find(([k])=>s.startsWith(k,i));
  if(m){out+=m[1];i+=m[0].length}else{out+=s[i];i++}
 }
 return out.split("|").filter(Boolean).map(p=>p[0]==="S"?p.slice(1).toUpperCase():p).join("-");
}

let CMU=null;
const cmuP=fetch("cmudict.json").then(r=>r.json()).then(d=>CMU=d).catch(()=>CMU=null);
const A2I={AA:'ɑ',AE:'æ',AH:'ʌ',AO:'ɔ',AW:'aʊ',AY:'aɪ',EH:'ɛ',ER:'ɝ',EY:'eɪ',IH:'ɪ',IY:'i',OW:'oʊ',OY:'ɔɪ',UH:'ʊ',UW:'u',B:'b',CH:'tʃ',D:'d',DH:'ð',F:'f',G:'ɡ',HH:'h',JH:'dʒ',K:'k',L:'l',M:'m',N:'n',NG:'ŋ',P:'p',R:'ɹ',S:'s',SH:'ʃ',T:'t',TH:'θ',V:'v',W:'w',Y:'j',Z:'z',ZH:'ʒ'};
const A2S={AA:'ah',AE:'a',AH:'uh',AO:'aw',AW:'ow',AY:'eye',EH:'eh',ER:'er',EY:'ay',IH:'ih',IY:'ee',OW:'oh',OY:'oy',UH:'u',UW:'oo',CH:'ch',JH:'j',SH:'sh',ZH:'zh',TH:'th',DH:'th',NG:'ng',Y:'y',HH:'h'};
const ONS=["P R","P L","B R","B L","T R","D R","K R","K L","G R","G L","F R","F L","S T","S P","S K","S M","S N","S L","S W","T W","K W","TH R","SH R","S P R","S T R","S K R","S K W","S P L"];
function cmuConvert(str){
 const ph=str.split(" ").map(x=>{const m=x.match(/^([A-Z]+)(\d)?$/);return{p:m[1],s:m[2]===undefined?null:+m[2]}});
 const v=ph.map((x,i)=>x.s!==null?i:-1).filter(i=>i>=0);
 const sy=v.map(()=>[]);
 const bounds=[0];
 for(let k=1;k<v.length;k++){
  const c=ph.slice(v[k-1]+1,v[k]).map(x=>x.p);let on=1;
  if(c.length>1){on=1;for(let n=Math.min(3,c.length);n>=2;n--){if(ONS.includes(c.slice(-n).join(" "))){on=n;break}}}
  bounds.push(v[k]-(c.length?on:0));
 }
 bounds.push(ph.length);
 const parts=v.map((_,k)=>ph.slice(bounds[k],bounds[k+1]));
 let ipa="",sim=[];
 parts.forEach(part=>{
  const nuc=part.find(x=>x.s!==null);let mk=nuc.s===1?"ˈ":nuc.s===2?"ˌ":"";
  let i="",s="";
  part.forEach(x=>{
   let a=A2I[x.p]||x.p.toLowerCase(),b=A2S[x.p]||x.p.toLowerCase();
   if(x.s!==null&&x.s===0){if(x.p==="AH")a="ə",b="uh";if(x.p==="ER")a="ɚ"}
   i+=a;s+=b;
  });
  ipa+=mk+i;sim.push(nuc.s===1?s.toUpperCase():s);
 });
 return{ipa,simple:sim.join("-")};
}
async function lookup(w){
 await cmuP;
 if(CMU&&CMU[w])return cmuConvert(CMU[w]);
 const r=await fetch("https://api.dictionaryapi.dev/v2/entries/en/"+encodeURIComponent(w));
 if(!r.ok)throw 0;
 const d=await r.json();
 const all=d.flatMap(e=>(e.phonetics||[]).concat(e.phonetic?[{text:e.phonetic}]:[])).filter(p=>p.text);
 const us=all.find(p=>/-us\b|-us\./.test(p.audio||""))||all[0];
 if(!us)throw 0;
 const ipa=us.text.replace(/^\/|\/$/g,"");
 return{ipa,simple:simplify(ipa)};
}

function txt(h){return new DOMParser().parseFromString(h,"text/html").body.textContent.trim()}
async function defs(w){
 const ph=w.includes(" ");
 const r=await fetch("https://en.wiktionary.org/api/rest_v1/page/definition/"+encodeURIComponent(w.replace(/ /g,"_")));
 if(!r.ok)throw 0;const j=await r.json();const o=[];
 (j.en||[]).forEach(e=>(e.definitions||[]).slice(0,ph?4:2).forEach(x=>{
  const t=txt(x.definition);if(!t)return;
  const raw=(x.parsedExamples&&x.parsedExamples.length)?x.parsedExamples.map(q=>q.example||""):(x.examples||[]);
  const ex=raw.map(txt).filter(z=>z&&z.length<220).slice(0,2);
  o.push({pos:e.partOfSpeech,t,ex});
 }));
 if(!o.length)throw 0;return o.slice(0,ph?6:5);
}
const WTc={};
function getWT(w){return WTc[w]||(WTc[w]=fetch("https://en.wiktionary.org/w/api.php?action=parse&page="+encodeURIComponent(w.replace(/ /g,"_"))+"&prop=wikitext&format=json&formatversion=2&origin=*")
 .then(r=>r.json()).then(j=>{const t=j.parse&&j.parse.wikitext;if(!t)throw 0;const m=t.match(/(?:^|\n)==English==[\s\S]*?(?=\n==[^=]|$)/);if(!m)throw 0;return m[0]}))}
async function trans(w){
 const sec=await getWT(w);
 const out=[],re=/\{\{trans-top\|([^\n]*?)\}\}([\s\S]*?)\{\{trans-bottom\}\}/g;let b;
 while((b=re.exec(sec))){
  const raw=b[1].replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,"$1").split("|").filter(x=>!/^\w+=/.test(x));
  const g=(raw[0]||"").replace(/\{\{[^}]*\}\}/g,"").replace(/'{2,3}/g,"").trim();
  const ws=[...b[2].matchAll(/\{\{tt?\+?\|es\|([^|}]+)/g)].map(x=>x[1].trim());
  if(ws.length)out.push({g,w:[...new Set(ws)]});
 }
 if(!out.length)throw 0;return out;
}
function lookupP(w){const a=w.split(" ");if(a.length==1)return lookup(w);
 return Promise.all(a.map(lookup)).then(r=>({ipa:r.map(x=>x.ipa).join(" "),simple:r.map(x=>x.simple).join(" ")}))}
const PART=new Set("up down in out on off over by along around away back through into across after apart ahead aside forward together under with about at for to against behind between past round without within onto from".split(" "));
const P3=new Set("with to up on for of out in about".split(" "));
async function phr(w){
 const r=await fetch("https://en.wiktionary.org/w/api.php?action=query&list=allpages&apprefix="+encodeURIComponent(w+"_")+"&aplimit=500&apnamespace=0&format=json&formatversion=2&origin=*");
 const j=await r.json();
 const o=j.query.allpages.map(p=>p.title).filter(t=>{const a=t.split(" ");return a[0]===w&&a.length>=2&&a.length<=3&&PART.has(a[1])&&(a.length==2||P3.has(a[2]))});
 if(!o.length)throw 0;return o.slice(0,30);
}
async function exs(w,d){
 const sec=await getWT(w),seen=new Set((d||[]).flatMap(x=>x.ex)),o=[];
 const clean=sec.replace(/\[\[(?:[^\]|]*\|)?([^\]]*)\]\]/g,"$1").replace(/\{\{(?:m|l|link|mention)\|en\|([^|}]*)(?:\|[^}]*)?\}\}/g,"$1");
 clean.split("\n").forEach(l=>{
  if(!/^#+:(?!\*)/.test(l))return;
  let t;const m=l.match(/\{\{(?:ux|uxi|usex|usex-inline)\|en\|([^|}]*)/);
  if(m)t=m[1];else if(!l.includes("{{"))t=l.replace(/^#+:\s*/,"");
  if(!t)return;t=t.replace(/'{2,3}/g,"").replace(/<[^>]+>/g,"").trim();
  if(t.length>8&&t.length<200&&!seen.has(t)&&!o.includes(t)&&o.length<8)o.push(t);
 });
 if(!o.length)throw 0;return o;
}
let tok=0;
function getR(){try{return JSON.parse(localStorage.getItem("recent")||"[]")}catch(e){return[]}}
function setR(a){try{localStorage.setItem("recent",JSON.stringify(a))}catch(e){}}
function showR(){
 const a=getR(),c=$("recent");c.innerHTML="";if(!a.length)return;
 const l=document.createElement("span");l.className="hint";l.textContent="Recent:";c.appendChild(l);
 a.forEach(w=>{const b=document.createElement("button");b.className="chip";b.textContent=w;b.onclick=()=>{$("q").value=w;search()};c.appendChild(b)});
 const x=document.createElement("button");x.className="hint";x.style.cssText="background:none;border:0;cursor:pointer;text-decoration:underline";x.textContent="clear";x.onclick=()=>{setR([]);showR()};c.appendChild(x);
}
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
async function search(){
 const w=$("q").value.trim().toLowerCase().replace(/\s+/g," "),out=$("out"),my=++tok;
 if(!w)return;
 if(!/^[a-z][a-z'\-]*( [a-z][a-z'\-]*){0,3}$/.test(w)){out.innerHTML='<span class="hint">Please type an English word or phrasal verb (up to 4 words).</span>';return}
 out.innerHTML='<span class="hint">Searching…</span>';
 const one=!w.includes(" ");
 const [p,d,t,pv]=await Promise.all([lookupP(w).catch(()=>null),defs(w).catch(()=>null),trans(w).catch(()=>null),one?phr(w).catch(()=>null):null]);
 if(my!==tok)return;
 out.innerHTML="";
 out.appendChild(el("h2","w",w));
 if(t){const all=[...new Set(t.flatMap(x=>x.w))].slice(0,4);out.appendChild(el("div","wes","Español: "+all.join(", ")))}
 if(p){const b=el("div","pl");b.appendChild(el("span","ipa","/"+p.ipa+"/"));b.appendChild(el("span","simple",p.simple));out.appendChild(b)}
 else out.appendChild(el("div","hint","Pronunciation not found — check the spelling."));
 if(d){
  out.appendChild(el("div","lab","Meanings (English)"));
  d.forEach(x=>{const m=el("div","m");m.appendChild(el("span","pos",x.pos));m.appendChild(document.createTextNode(x.t));
   if(x.ex.length){const b=el("button","lnk","Show example"),e=el("div","ex");e.style.display="none";x.ex.forEach(z=>e.appendChild(el("div","",z)));
    b.onclick=()=>{const sh=e.style.display==="none";e.style.display=sh?"block":"none";b.textContent=sh?"Hide example":"Show example"};
    m.appendChild(document.createElement("br"));m.appendChild(b);m.appendChild(e)}
   out.appendChild(m)});
 }
 if(t){
  out.appendChild(el("div","lab","En español"));
  t.slice(0,6).forEach(x=>{const m=el("div","m");if(x.g)m.appendChild(el("div","hint",x.g));m.appendChild(el("div","esw",x.w.join(", ")));out.appendChild(m)});
 }
 if(!d&&!t&&p)out.appendChild(el("div","hint","Meanings are not available for this word."));
 if(!p&&!d&&!t&&!pv){out.innerHTML='<span class="hint">Not found. Check the spelling.</span>';return}
 if(pv){
  out.appendChild(el("div","lab","Phrasal verbs with “"+w+"”"));
  const c=el("div","chips");pv.forEach(v=>{const b=el("button","chip",v);b.onclick=()=>{$("q").value=v;search()};c.appendChild(b)});out.appendChild(c);
 }
 const xb=el("button","chip","More example sentences"),xo=el("div","exs");
 xb.onclick=async()=>{xb.disabled=true;xb.textContent="Loading…";
  try{const a=await exs(w,d);if(my!==tok)return;a.forEach(z=>{const m=el("div","m");m.appendChild(el("div","",z));xo.appendChild(m)});xb.remove()}
  catch(e){xb.disabled=false;xb.textContent="More example sentences";xo.innerHTML='<span class="hint">No more examples found for this word.</span>'}};
 out.appendChild(xb);out.appendChild(xo);
 const a=getR().filter(x=>x!==w);a.unshift(w);setR(a.slice(0,10));showR();
}
$("go").onclick=search;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
showR();
</script></body></html>
